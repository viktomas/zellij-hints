[package]
name = "zellij-hints"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "kitty-hints / tmux-thumbs style label hints for Zellij panes"
publish = false

[dependencies]
zellij-tile = "0.45.1"
vte = "0.11"
regex = "1"
unicode-width = "0.2"

# The pure matching/labeling core (everything except the wasm plugin shell)
# has no zellij-tile dependency and is unit-tested natively with `cargo test`.
[lib]
name = "zellij_hints"
path = "src/lib.rs"

[[bin]]
name = "zellij-hints"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
